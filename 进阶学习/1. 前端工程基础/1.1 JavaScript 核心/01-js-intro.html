<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 JavaScript 入门</title>
  <style>
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.7;
      color: #1f2937;
      background: #f8fafc;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      background: #2563eb;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #dbeafe;
      border-radius: 6px;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <h1>01 JavaScript 入门</h1>
  <p>打开浏览器控制台，观察 JavaScript 输出的信息。</p>

  <button id="showInfoBtn">显示学习信息</button>
  <div id="result">点击按钮后，这里会显示 JavaScript 生成的内容。</div>

  <script src="./01-js-intro.js"></script>
</body>
</html>
